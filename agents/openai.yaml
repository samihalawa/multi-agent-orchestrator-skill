interface:
  display_name: "Multi-Agent Orchestrator"
  short_description: "Coordinate bounded independent work and verify the complete outcome."
  default_prompt: >-
    Use $multi-agent-orchestrator for complex, broad, recovery or explicitly
    parallel work. Bind the current request and proof layer, reuse verified
    prior-route and current-source evidence, and delegate only necessary
    independent lanes. Use current configured models and preserve fixed role
    assignments or explicit user choices. Prefer connectors; follow the active
    global browser and authentication routes, including their supported fallback.
    Keep one shared controller, assign disjoint ownership, preserve others' work,
    and retain successful state. Correct the exact failing layer without fixed
    retry quotas. Obtain applicable reviews without duplicate ceremony and verify
    every authorised outcome. Adapt communication to the user; examples never
    require a fixed opening phrase, section count or closing template.
